<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartAudio Pro - Ultra Claridad</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151f32;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        header {
            text-align: center;
        }

        header h1 {
            font-size: 1.4rem;
            margin: 0;
            color: var(--accent);
        }

        header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 4px 0 0 0;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card h2 {
            font-size: 0.9rem;
            margin: 0;
            color: var(--accent);
            border-bottom: 1px solid #24334d;
            padding-bottom: 6px;
        }

        .btn {
            background-color: var(--accent);
            color: #0b0f19;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .btn-danger { background-color: var(--danger); color: white; }

        select, input[type="range"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background-color: #0b0f19;
            color: var(--text-main);
            border: 1px solid #24334d;
            box-sizing: border-radius;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        canvas {
            width: 100%;
            height: 90px;
            background-color: #070a10;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>SmartAudio Assistant V3</h1>
            <p>Modo Alta Fidelidad y Baja Latencia</p>
        </header>

        <div class="card">
            <div class="control-group">
                <label for="micSelect">Fuente de Micrófono:</label>
                <select id="micSelect">
                    <option value="">Cargando micrófonos...</option>
                </select>
            </div>

            <button id="mainBtn" class="btn">Iniciar Amplificación HD</button>
        </div>

        <div class="card">
            <h2>Espectro Frecuencial</h2>
            <canvas id="visualizer"></canvas>
        </div>

        <div class="card">
            <h2>Ecualizador de Claridad (Quitar sonido tapado)</h2>
            
            <div class="control-group">
                <label>Volumen General: <span id="gainVal">1.5x</span></label>
                <input type="range" id="gainRange" min="0.5" max="4.0" step="0.1" value="1.5">
            </div>

            <div class="control-group">
                <label>Brillo / Agudos (Claridad Vocal): <span id="trebleVal">+8 dB</span></label>
                <input type="range" id="trebleRange" min="0" max="20" step="1" value="8">
            </div>

            <div class="control-group">
                <label>Corte de Retorno Vocal (Propia voz): <span id="bassVal">-6 dB</span></label>
                <input type="range" id="bassRange" min="-20" max="5" step="1" value="-6">
            </div>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let mediaStream = null;
        let sourceNode = null;
        let gainNode = null;
        let bassFilter = null;   // Para mitigar propia voz y retumbos graves
        let trebleFilter = null; // Para quitar lo tapado (Aumentar nitidez de consonantes)
        let limiterNode = null;  // Para evitar distorsión a alto volumen
        let analyserNode = null;
        let isRunning = false;

        const mainBtn = document.getElementById('mainBtn');
        const micSelect = document.getElementById('micSelect');
        const gainRange = document.getElementById('gainRange');
        const gainVal = document.getElementById('gainVal');
        const trebleRange = document.getElementById('trebleRange');
        const trebleVal = document.getElementById('trebleVal');
        const bassRange = document.getElementById('bassRange');
        const bassVal = document.getElementById('bassVal');
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');

        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        async function updateDeviceList() {
            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioInputs = devices.filter(device => device.kind === 'audioinput');
                
                micSelect.innerHTML = '';
                audioInputs.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `Micrófono ${index + 1}`;
                    micSelect.appendChild(option);
                });
            } catch (err) {
                console.error(err);
            }
        }

        updateDeviceList();

        mainBtn.addEventListener('click', async () => {
            if (!isRunning) {
                try {
                    // Forzar tasa de muestreo alta y baja latencia
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)({
                        latencyHint: 'interactive',
                        sampleRate: 48000
                    });

                    if (audioCtx.state === 'suspended') {
                        await audioCtx.resume();
                    }

                    const selectedMicId = micSelect.value;
                    const constraints = {
                        audio: {
                            deviceId: selectedMicId ? { exact: selectedMicId } : undefined,
                            echoCancellation: false, // Desactivado para evitar sonido "tapado"
                            noiseSuppression: false, // Desactivado para mantener brillo natural
                            autoGainControl: false,  // Controlamos la ganancia manualmente
                            channelCount: 2          // Intentar capturar en estéreo (usar matriz de mics)
                        }
                    };

                    mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                    sourceNode = audioCtx.createMediaStreamSource(mediaStream);
                    
                    // 1. Filtro de Graves (Highshelf para atenuar propia voz/retumbo)
                    bassFilter = audioCtx.createBiquadFilter();
                    bassFilter.type = 'lowshelf';
                    bassFilter.frequency.value = 300;
                    bassFilter.gain.value = parseFloat(bassRange.value);

                    // 2. Filtro de Agudos (Highshelf para dar brillo y presencia a las consonantes)
                    trebleFilter = audioCtx.createBiquadFilter();
                    trebleFilter.type = 'highshelf';
                    trebleFilter.frequency.value = 2500;
                    trebleFilter.gain.value = parseFloat(trebleRange.value);

                    // 3. Limite de Seguridad / Anti-distorsión
                    limiterNode = audioCtx.createDynamicsCompressor();
                    limiterNode.threshold.value = -2.0; // No deja pasar nada sobre -2dB
                    limiterNode.knee.value = 0.0;
                    limiterNode.ratio.value = 20.0;     // Limitador estricto
                    limiterNode.attack.value = 0.001;
                    limiterNode.release.value = 0.100;

                    // 4. Ganancia Master
                    gainNode = audioCtx.createGain();
                    gainNode.gain.value = parseFloat(gainRange.value);

                    // 5. Analizador
                    analyserNode = audioCtx.createAnalyser();
                    analyserNode.fftSize = 256;

                    // Conexión de la cadena de audio DSP
                    sourceNode.connect(bassFilter);
                    bassFilter.connect(trebleFilter);
                    trebleFilter.connect(gainNode);
                    gainNode.connect(limiterNode);
                    limiterNode.connect(analyserNode);
                    analyserNode.connect(audioCtx.destination);

                    mainBtn.textContent = 'Detener Amplificador';
                    mainBtn.classList.add('btn-danger');
                    isRunning = true;

                    visualize();

                } catch (err) {
                    alert('Error de audio: ' + err.message);
                }
            } else {
                stopAudio();
            }
        });

        function stopAudio() {
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            if (audioCtx) audioCtx.close();
            mainBtn.textContent = 'Iniciar Amplificación HD';
            mainBtn.classList.remove('btn-danger');
            isRunning = false;
        }

        gainRange.addEventListener('input', (e) => {
            gainVal.textContent = e.target.value + 'x';
            if (gainNode) gainNode.gain.value = parseFloat(e.target.value);
        });

        trebleRange.addEventListener('input', (e) => {
            trebleVal.textContent = '+' + e.target.value + ' dB';
            if (trebleFilter) trebleFilter.gain.value = parseFloat(e.target.value);
        });

        bassRange.addEventListener('input', (e) => {
            bassVal.textContent = e.target.value + ' dB';
            if (bassFilter) bassFilter.gain.value = parseFloat(e.target.value);
        });

        function visualize() {
            if (!isRunning) return;
            const bufferLength = analyserNode.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                if (!isRunning) return;
                requestAnimationFrame(draw);
                analyserNode.getByteFrequencyData(dataArray);

                canvasCtx.fillStyle = '#070a10';
                canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

                const barWidth = (canvas.width / bufferLength) * 2.5;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    let barHeight = dataArray[i] / 2.5;
                    canvasCtx.fillStyle = `rgb(56, 189, 248)`;
                    canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                    x += barWidth + 1;
                }
            }
            draw();
        }
    </script>
</body>
</html>
